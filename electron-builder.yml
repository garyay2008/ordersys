appId: com.ordersys.pos
productName: orderSYS
copyright: Copyright © orderSYS

directories:
  output: dist_electron
  buildResources: build

# 打包進 App 的檔案（node_modules 生產依賴由 electron-builder 自動帶入）
files:
  - server.js
  - config/**/*
  - models/**/*
  - plugins/**/*
  - routes/**/*
  - utils/**/*
  - middleware/**/*
  - electron/**/*
  - client/dist/**/*
  - public/**/*
  - fonts/**/*
  - package.json

# 不用 asar 打包：避免 @napi-rs/canvas 原生 .node 與動態 require 路徑問題
asar: false

# @napi-rs/canvas 為 N-API（ABI 穩定），無需針對 Electron 重新編譯
npmRebuild: false

mac:
  target:
    - dmg
  category: public.app-category.business

win:
  target:
    - nsis

linux:
  target:
    - AppImage
    - deb
  category: Office
  maintainer: orderSYS <garyay2008@gmail.com>

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
