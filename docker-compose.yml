services:
  postgres:
    image: postgres:17
    container_name: ordersys-postgres
    restart: unless-stopped
    environment:
      TZ: "Asia/Hong_Kong"
      POSTGRES_USER: ordersys
      POSTGRES_PASSWORD: ordersys
      POSTGRES_DB: ordersys
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ordersys -d ordersys"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - ordersys

  app:
    build: .
    container_name: ordersys-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PG_CONN: "postgres://ordersys:ordersys@postgres:5432/ordersys"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "e9d2d19f8c27bc6cd089140797a4a50caf88fbdc5a90c7771da306e7d7df0906"
      LICENSE_KEY: ""
      # LICENSE_PUBLIC_KEY: "-----BEGIN PUBLIC KEY-----..."   # 可覆寫內建公鑰（通常不需設定）
      # MACHINE_ID: "customer-machine-id"   # Docker 部署建議設定，作為授權綁定的機器識別碼
      # LICENSE_ENFORCE: "1"                 # 設定為 1 才強制攔截未授權/過期的 /api 請求
      NODE_ENV: "production"
      TZ: "Asia/Hong_Kong"
      QUEUE_UI_USER: "admin"
      QUEUE_UI_PASSWORD: "ordersys"
    volumes:
      - ./public/logo:/app/public/logo
      - ./public/qr:/app/public/qr
      - ./public/shop:/app/public/shop
      - ./public/fonts:/app/public/fonts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - ordersys

  redis:
    image: redis:7-alpine
    container_name: ordersys-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - ordersys

volumes:
  postgres_data:
  redis_data:

networks:
  ordersys:
    driver: bridge
